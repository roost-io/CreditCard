openapi: 3.0.3
info:
  title: Credit Card Collection Compliance API
  version: 1.0.0
  description: >
    API specification for compliant, masked, and auditable credit card collection workflows, notifications, state transitions, 
    agency/legal integrations, masking enforcement and error handling as per regulatory and business mandates.

servers:
  - url: https://api.cards-collection.example.com/v1

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    accountId:
      in: path
      name: account_id
      required: true
      schema:
        type: string
      description: The unique identifier for the cardholder account.
    cardId:
      in: path
      name: card_id
      required: true
      schema:
        type: string
      description: The card entity identifier.
  schemas:
    Notification:
      type: object
      properties:
        account_id:
          type: string
          example: 12345
        channel:
          type: string
          enum: [email, sms, in-app, document]
          example: email
        cardholder_name:
          type: string
          example: Alice Smith
        last_4:
          type: string
          pattern: '^\d{4}$'
          example: 1881
        due_date:
          type: string
          format: date
          example: 2024-07-15
        due_amount:
          type: string
          example: "$500.00"
        overdue_amount:
          type: string
          example: "$300.00"
        late_fee:
          type: string
          example: "$10.00"
        message:
          type: string
          example: "Your card ending 1881 has a payment due of $500.00 on 2024-07-15."
        recipient_role:
          type: string
          enum: [cardholder, agency, legal_staff, administrator]
      required:
        - account_id
        - channel
        - last_4
    AuditLog:
      type: object
      properties:
        event_type:
          type: string
          enum: [notification, state_transition, masking_error, transmission, payment_attempt, access_denied, error]
        account_id:
          type: string
        cardholder_name:
          type: string
        last_4:
          type: string
        recipient:
          type: string
        role:
          type: string
        timestamp:
          type: string
          format: date-time
        compliance:
          type: object
          properties:
            masking_enforced:
              type: boolean
            regulatory_check:
              type: string
              enum: [passed, failed]
        details:
          type: string
      required: [event_type, account_id, last_4, timestamp]
    CollectionAgencyTransmission:
      type: object
      properties:
        balance_due:
          type: string
          example: "$800.00"
        cardholder_name:
          type: string
        last_4_digits:
          type: string
        status:
          type: string
          enum: [sent, ack, error]
        error:
          type: string
          nullable: true
      required: [balance_due, cardholder_name, last_4_digits]
    Escalation:
      type: object
      properties:
        account_id:
          type: string
        escalated_state:
          type: string
          enum: [collection, agency, legal, active]
        last_4:
          type: string
        transition:
          type: string
          enum: [escalate, deescalate]
        status:
          type: string
          enum: [success, error]
        error:
          type: string
          nullable: true
      required: [account_id, escalated_state, last_4, transition, status]
    NotificationPreference:
      type: object
      properties:
        channel:
          type: string
          enum: [email, sms, in-app, document]
        enabled:
          type: boolean
      required:
        - channel
        - enabled
    PaymentPlanProposal:
      type: object
      properties:
        account_id:
          type: string
        last_4:
          type: string
        proposal_terms:
          type: object
          properties:
            installment_amount:
              type: string
              example: "$150.00"
            installment_date:
              type: string
              format: date
          required: [installment_amount, installment_date]
        status:
          type: string
          enum: [sent, accepted, rejected, breached, error]
        error:
          type: string
          nullable: true
      required: [account_id, last_4, proposal_terms, status]

paths:
  /accounts/{account_id}/notifications/reminder:
    post:
      summary: Send payment due reminder notification (masked, auditable)
      description: >
        Sends a masked notification to the cardholder via the specified channel,
        enforcing PII masking (last 4 digits only), with audit logging and compliance checks.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [email, sms, in-app]
                due_date:
                  type: string
                  format: date
                due_amount:
                  type: string
                cardholder_name:
                  type: string
                last_4:
                  type: string
                  pattern: '^\d{4}$'
              required: [channel, due_date, due_amount, cardholder_name, last_4]
      responses:
        '201':
          description: Reminder notification delivered successfully (masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid request (bad input, out-of-window, or duplicate)
        '403':
          description: Unauthorized or masking violation
        '409':
          description: Duplicate notification blocked
  /accounts/{account_id}/notifications/overdue:
    post:
      summary: Send overdue balance alert (masked, auditable)
      description: >
        Sends overdue alert to cardholder if unpaid/partial status, includes masking (last 4), overdue amount,
        and audit of alert/state change.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardholder_name:
                  type: string
                channel:
                  type: string
                  enum: [email, sms, in-app]
                overdue_amount:
                  type: string
                last_4:
                  type: string
                  pattern: '^\d{4}$'
              required: [cardholder_name, channel, overdue_amount, last_4]
      responses:
        '201':
          description: Overdue notification sent (masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid status or masking error
        '403':
          description: Unauthorized
        '409':
          description: Duplicate or state prevented

  /accounts/{account_id}/notifications/collection:
    post:
      summary: Send collection notification at defined delinquency boundary with dynamic fee
      description: >
        Sends collection notification if overdue/delinquency threshold met. Includes masked card (last 4), overdue amount, late fee,
        and complete audit logging.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  enum: [email, sms, in-app, document]
                overdue_amount:
                  type: string
                late_fee:
                  type: string
                last_4:
                  type: string
                  pattern: '^\d{4}$'
                delinquency_days:
                  type: integer
              required: [channel, overdue_amount, late_fee, last_4, delinquency_days]
      responses:
        '201':
          description: Collection notification sent (masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Not yet delinquent, masking or input error
        '409':
          description: Already sent or out-of-window

  /agency/transmit:
    post:
      summary: Collection agency data hand-off with masking & compliance
      description: >
        Securely transmits masked (last 4 only) debtor data to agency endpoint. Fully auditable and errors handled.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionAgencyTransmission'
      responses:
        '200':
          description: Agency acknowledged receipt (masked data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionAgencyTransmission'
        '202':
          description: Data transmission accepted, acknowledgment pending
        '400':
          description: Data or masking error
        '409':
          description: Integration error or rejected by agency

  /accounts/{account_id}/escalation:
    post:
      summary: Escalate/de-escalate collection workflow state (masked, auditable)
      description: >
        Trigger escalation or de-escalation to agency/legal, enforcing masking and compliance, with full audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Escalation'
      responses:
        '200':
          description: Escalation/de-escalation completed and logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Escalation'
        '400':
          description: Invalid transition, masking, or account status
        '404':
          description: Account not found

  /accounts/{account_id}/notification-preferences:
    get:
      summary: Retrieve notification channel opt-in/out preferences for cardholder
      responses:
        '200':
          description: Current channel preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
        '403':
          description: Unauthorized
    put:
      summary: Set notification channel opt-in/out preferences for cardholder (masked)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NotificationPreference'
      responses:
        '200':
          description: Preferences updated, audit logged
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
        '400':
          description: Invalid request
        '403':
          description: Unauthorized

  /accounts/{account_id}/payment-plan/proposal:
    post:
      summary: Propose payment plan enrollment if eligible (masked, compliant)
      description: >
        Issues a payment plan proposal to an overdue cardholder within configured threshold with last 4 masking.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overdue_days:
                  type: integer
                min_days:
                  type: integer
                max_days:
                  type: integer
                last_4:
                  type: string
                proposal_terms:
                  type: object
                  properties:
                    installment_amount:
                      type: string
                    installment_date:
                      type: string
              required: [overdue_days, min_days, max_days, last_4]
      responses:
        '201':
          description: Payment plan proposal sent and audit logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanProposal'
        '400':
          description: Not eligible or input/masking error
        '409':
          description: Duplicate or policy violation

  /accounts/{account_id}/notifications/retry:
    post:
      summary: Retry notification on failure (masked, retriable, auditable)
      description: >
        Retries past notification delivery on transient error, enforcing masking and policy retry limit.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                  example: overdue
                contact:
                  type: string
                retry_limit:
                  type: integer
                last_4:
                  type: string
              required: [stage, contact, retry_limit, last_4]
      responses:
        '200':
          description: Retry performed or escalated, audit logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '202':
          description: Retry queued
        '400':
          description: Invalid parameters or masking error
        '429':
          description: Retry limit reached

  /accounts/{account_id}/audit-log:
    get:
      summary: Retrieve all audit logs for the account (masked, compliant)
      parameters:
        - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Audit log retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '403':
          description: Unauthorized access
  /audit-log:
    get:
      summary: Retrieve audit logs (multiple accounts; admin/legal use only)
      description: >
        Retrieves audit logs with proper masking and privilege checks. Access denied and logged for non-authorized.
      parameters:
        - in: query
          name: account_id
          schema:
            type: string
        - in: query
          name: event_type
          schema:
            type: string
      responses:
        '200':
          description: Audit log retrieved (admin/legal only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '403':
          description: Unauthorized/privilege violation

  /accounts/{account_id}/documents/generated:
    post:
      summary: Generate and transmit external/legal documents (masked)
      description: >
        Generates a document (agency/legal forms) containing ONLY last 4 digits and transmits securely; blocks/logs error on unmasked data.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_type:
                  type: string
                  enum: [cardholder, agency, legal_staff, administrator]
                last_4:
                  type: string
              required: [recipient_type, last_4]
      responses:
        '201':
          description: Document generated, transmitted, audit logged
        '400':
          description: Masking error (full card in document), rejected

  /accounts/{account_id}/notifications/multichannel:
    post:
      summary: Multi-channel notification delivery (with role masking)
      description: >
        Delivers notification to recipient via specified channel, role, and workflow stage with proper masking.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                stage:
                  type: string
                role:
                  type: string
                  enum: [cardholder, agency, legal_staff, administrator]
                cardholder_name:
                  type: string
                last_4:
                  type: string
              required: [channel, stage, role, cardholder_name, last_4]
      responses:
        '201':
          description: Notification sent, audit logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Masking or template error

  /accounts/{account_id}/notifications/duplicate-prevention:
    post:
      summary: Prevent duplicate/out-of-window notifications
      description: >
        Validates and suppresses duplicate/out-of-window reminders per configured window and masking.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                due_date:
                  type: string
                window_min:
                  type: integer
                window_max:
                  type: integer
                days_before_due:
                  type: integer
                last_4:
                  type: string
                duplicate_attempt:
                  type: boolean
              required: [due_date, window_min, window_max, days_before_due, last_4]
      responses:
        '201':
          description: Notification sent or blocked as duplicate; audit/log
        '409':
          description: Duplicate/out-of-window blocked

  /accounts/{account_id}/lifecyle/state:
    patch:
      summary: Advance or recover collection workflow state (incl. outage handling)
      description: >
        Advance, resume or recover workflow state (reminder, overdue, collection, plan, agency, legal), ensuring masking and audit
        during transitions, including after system outage.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [advance, resume, recover]
                last_4:
                  type: string
              required: [action, last_4]
      responses:
        '200':
          description: State advanced/recovered; notifications and logs comply
        '400':
          description: Masking/compliance failure

  /accounts/{account_id}/notifications/due-date-adjustment:
    post:
      summary: Adjust due date and recalculate notification windows (masked)
      description: >
        Handles due-date changes, recalculates reminder windows, avoids obsolete/duplicate reminders, audits masking.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                original_due_date:
                  type: string
                new_due_date:
                  type: string
                last_4:
                  type: string
              required: [original_due_date, new_due_date, last_4]
      responses:
        '200':
          description: Reminder window recalculated, notifications adjusted
        '400':
          description: Invalid/masking error

  /accounts/{account_id}/notifications/collection-update-balance:
    post:
      summary: Send updated collection notification after real-time partial payment
      description: >
        Updates overdue balance, issues new collection notification using masking, blocks stale/out-of-balance attempts.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overdue_amount:
                  type: string
                payment_amount:
                  type: string
                last_4:
                  type: string
              required: [overdue_amount, payment_amount, last_4]
      responses:
        '201':
          description: Updated notification delivered; audit logged
        '409':
          description: Stale/incorrect balance notification blocked

  /accounts/{account_id}/notifications/pii-scan:
    post:
      summary: Scan for PII/masking violation before notification transmission
      description: >
        Checks outgoing notification for full card or PII exposure; blocks and logs if masking fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_payload:
                  type: string
                contact:
                  type: string
                retry_limit:
                  type: integer
              required: [notification_payload, contact, retry_limit]
      responses:
        '400':
          description: Masking/PII failure blocked and audit logged
        '409':
          description: Transmission failure, retry logic applied

  /accounts/{account_id}/payment-plan/action:
    post:
      summary: Accept, refuse, or breach payment plan proposal (masked, auditable)
      description: >
        Accept/refuse/breach a payment plan, all masked; triggers proper workflow branch, logs compliance and masking.
      parameters:
        - $ref: '#/components/parameters/accountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardholder_name:
                  type: string
                response_type:
                  type: string
                  enum: [accept, partial_accept, refuse, breach]
                last_4:
                  type: string
              required: [cardholder_name, response_type, last_4]
      responses:
        '200':
          description: Branch executed, audit logged
        '400':
          description: Invalid state, masking, or branch logic error

  /accounts/{account_id}/fees-breakdown:
    get:
      summary: Retrieve itemized collection fees and charges (masked)
      parameters:
        - $ref: '#/components/parameters/accountId'
      responses:
        '200':
          description: Fee breakdown provided with masking
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_4:
                    type: string
                  itemized_fees:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        amount:
                          type: string
                  authorized:
                    type: boolean
          headers:
            X-Masked:
              description: Always true; full card never included
              schema:
                type: boolean
        '403':
          description: Unauthorized/unauthenticated, audit and block

tags:
  - name: Notification
    description: Masked and auditable notifications (reminder, overdue, collection, multi-channel, retry, duplicate prevention)
  - name: Escalation
    description: Escalation/de-escalation, agency/legal hand-off, masking enforcement
  - name: PaymentPlan
    description: Payment plan proposal, acceptance/refusal/breach
  - name: Preferences
    description: Opt-in/out notification channel management
  - name: Audit
    description: Regulatory, masking, and workflow audit logging
  - name: ExternalDocument
    description: Secure document/payload generation and transmission
  - name: AccountState
    description: State transition; lifecycle advancement, outage recovery
  - name: FeesBreakdown
    description: Itemized fee/charge breakdown retrieval (masked)
  - name: Performance
    description: Bulk dispatch and load/performance requirements

