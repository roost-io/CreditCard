openapi: 3.0.3
info:
  title: Credit Card Collection Lifecycle Communication and Data Masking API
  description: >
    API for managing credit card collection lifecycle events, notifications, escalations, audit, and ensuring data masking compliance.
  version: '1.0.0'
servers:
  - url: https://testcardsystem.example.com
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
      description: Unique account identifier
    Stage:
      name: stage
      in: query
      required: false
      schema:
        type: string
        enum: [DueReminder, OverdueAlert, Collection, PaymentPlan, Agency, Legal]
      description: The notification/collection lifecycle stage
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
      description: The notification or event identifier
    AgencyUser:
      name: agencyUser
      in: path
      required: true
      schema:
        type: string
      description: The collection agency user identifier
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
      description: Unique id for an incident/ticket

  schemas:
    MaskedCard:
      type: object
      properties:
        maskedNumber:
          type: string
          pattern: '^\\*\\*\\*\\* \\*\\*\\*\\* \\*\\*\\*\\* \\d{4}$'
          example: '**** **** **** 4242'
        last4:
          type: string
          pattern: '^\\d{4}$'
          example: '4242'
    NotificationRequest:
      type: object
      properties:
        accountId:
          type: string
        stage:
          type: string
          enum: [DueReminder, OverdueAlert, Collection, PaymentPlan, Agency, Legal]
        dueDate:
          type: string
          format: date
        amountDue:
          type: string
          example: '$250'
      required: [accountId, stage]
    NotificationResponse:
      type: object
      properties:
        notificationId:
          type: string
        status:
          type: string
          enum: [sent, undeliverable, rejected]
        deliveredAt:
          type: string
          format: date-time
        recipient:
          type: string
        maskedCard:
          $ref: '#/components/schemas/MaskedCard'
        dueDate:
          type: string
          format: date
        amountDue:
          type: string
        message:
          type: string
      required: [status, maskedCard]
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: INVALID_MASKING
        message:
          type: string
    EscalationRequest:
      type: object
      properties:
        accountId:
          type: string
      required: [accountId]
    EscalationResponse:
      type: object
      properties:
        status:
          type: string
        previousState:
          type: string
        newState:
          type: string
        agencyPayload:
          type: object
          properties:
            accountId:
              type: string
            customerName:
              type: string
            maskedCard:
              $ref: '#/components/schemas/MaskedCard'
        auditReference:
          type: string
      required: [status, newState]
    PaymentPlanProposalRequest:
      type: object
      properties:
        accountId:
          type: string
      required: [accountId]
    PaymentPlanProposalResponse:
      type: object
      properties:
        status:
          type: string
        repaymentSchedule:
          type: string
        reducedFees:
          type: string
        notificationId:
          type: string
        maskedCard:
          $ref: '#/components/schemas/MaskedCard'
        auditReference:
          type: string
      required: [status, notificationId, maskedCard]
    AuditLogEntry:
      type: object
      properties:
        eventId:
          type: string
        accountId:
          type: string
        eventType:
          type: string
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
        maskedCard:
          $ref: '#/components/schemas/MaskedCard'
        status:
          type: string
        details:
          type: object
      required: [eventId, accountId, eventType, timestamp, userId, maskedCard]
    IncidentReport:
      type: object
      properties:
        incidentId:
          type: string
        status:
          type: string
          enum: [open, resolved]
        reason:
          type: string
        maskedCard:
          $ref: '#/components/schemas/MaskedCard'
        openedAt:
          type: string
          format: date-time
      required: [incidentId, status, reason, maskedCard]
    AgencyHandoffRequest:
      type: object
      properties:
        accountId:
          type: string
      required: [accountId]
    AgencyHandoffResponse:
      type: object
      properties:
        handoffId:
          type: string
        status:
          type: string
          enum: [success, duplicate, ineligible, rejected]
        agencyPayload:
          type: object
          properties:
            accountId:
              type: string
            customerName:
              type: string
            maskedCard:
              $ref: '#/components/schemas/MaskedCard'
        auditReference:
          type: string
      required: [status, agencyPayload]

paths:
  # Notification generation endpoint
  /notifications/send:
    post:
      summary: Send notification for a collection lifecycle event
      description: Send a lifecycle notification (due, overdue, collection, payment plan, legal, etc.) ensuring PAN masking and mandatory fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Notification sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          description: Bad Request (e.g., improper masking, missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Unauthorized or forbidden recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Notification retrieval by accountId or notificationId (for logs/audit/PII masking validation)
  /accounts/{accountId}/notifications:
    get:
      summary: Get all notifications for an account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: List of notifications for the account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'

  /notifications/{notificationId}:
    get:
      summary: Retrieve a specific notification
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification details, always showing masked card number only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          description: Notification not found

  # Batch job trigger for notifications, overdue, collection, and legal
  /batch/jobs/{stage}:
    post:
      summary: Trigger batch job for lifecycle stage (due reminder, overdue, collection, legal, etc.)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Stage'
      responses:
        '200':
          description: Batch job execution status with list of notification results
          content:
            application/json:
              schema:
                type: object
                properties:
                  executed:
                    type: boolean
                  stage:
                    type: string
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationResponse'
        '403':
          description: Stage not enabled or unauthorized
        '500':
          description: Batch job failure

  # Initiate payment plan proposal
  /accounts/{accountId}/payment-plan-proposal:
    post:
      summary: Initiate payment plan proposal for an eligible account
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanProposalRequest'
      responses:
        '200':
          description: Payment plan proposal initiated and notification sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanProposalResponse'
        '400':
          description: Not eligible for payment plan or already in legal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Trigger escalation/handoff to collection agency
  /agency/handoff:
    post:
      summary: Handoff eligible accounts to collection agency (API payload always masked)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgencyHandoffRequest'
      responses:
        '200':
          description: Handoff successful, only approved fields transmitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgencyHandoffResponse'
        '409':
          description: Duplicate escalation suppressed by idempotency logic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Ineligible for handoff, or rejected masking/integrity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Get collection agency user assigned accounts
  /agencies/{agencyUser}/accounts:
    get:
      summary: List assigned accounts for a collection agency user (access controlled, masked data only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgencyUser'
      responses:
        '200':
          description: List of assigned accounts with masked card data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    accountId:
                      type: string
                    customerName:
                      type: string
                    maskedCard:
                      $ref: '#/components/schemas/MaskedCard'
                  required: [accountId, maskedCard]
        '403':
          description: Access denied for unassigned accounts

  # Incident/Ticket endpoint for undeliverable notifications
  /incidents:
    post:
      summary: Raise an incident due to failed or undeliverable notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                maskedCard:
                  $ref: '#/components/schemas/MaskedCard'
                reason:
                  type: string
      responses:
        '201':
          description: Incident created for undeliverable notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReport'

  # Fetch audit logs for given account or event
  /accounts/{accountId}/audit:
    get:
      summary: Get immutable audit logs for account events (always masked)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Audit log entries (masked)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'

  # Simulated endpoint for notification template/content validation
  /notifications/validate:
    post:
      summary: Validate notification content for correct field presence and masking (template QA)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                fieldsPresent:
                  type: array
                  items:
                    type: string
                maskedCard:
                  type: string
      responses:
        '200':
          description: Notification content ok (compliant)
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
        '400':
          description: Masking or required field violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Legal documents retrieval endpoint
  /accounts/{accountId}/legal-documents:
    get:
      summary: Retrieve all legal documents generated for an account (masked card data only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: List of legal documents in PDF or e-doc format pointers, content is masked
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    documentId:
                      type: string
                    documentType:
                      type: string
                      enum: [PDF, E-Doc]
                    url:
                      type: string
                    maskedCard:
                      $ref: '#/components/schemas/MaskedCard'
                  required: [documentId, url, maskedCard]
  # Outbound message validation endpoint for anti-PAN-leak
  /outbound/validate:
    post:
      summary: Check outbound communication for full card number leaks (block/quarantine API)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
      responses:
        '200':
          description: No PAN found, safe to deliver
          content:
            application/json:
              schema:
                type: object
                properties:
                  compliant:
                    type: boolean
                    example: true
        '400':
          description: PAN found, message blocked/quarantined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Endpoint for retry and logging of notification transmission failures
  /notifications/{notificationId}/retry:
    post:
      summary: Retry failed notification transmission, ensuring only masked card is present in logs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Retry executed, status and audit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'

  # Outbound notification event consistency across accounts/cross-customer protection
  /notifications/batch/send:
    post:
      summary: Send notification batch for multiple accounts (cross-customer data prevention)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Notifications sent for each account, each with correct/masked data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'
        '409':
          description: Attempt to send cross-customer data detected and prevented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # State transition endpoint (Due → Overdue → Collection, etc.)
  /accounts/{accountId}/state-transition:
    post:
      summary: Explicitly advance or query account state transitions, enforcing masking and business rules
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestedTransition:
                  type: string
                  enum: [Due, Overdue, Collection, PaymentPlan, Agency, Legal]
      responses:
        '200':
          description: State transition completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  previousState:
                    type: string
                  newState:
                    type: string
                  maskedCard:
                    $ref: '#/components/schemas/MaskedCard'
                  result:
                    type: string
        '400':
          description: Invalid or ineligible transition (e.g., cannot bypass states)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
