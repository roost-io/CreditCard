openapi: 3.0.3
info:
  title: Credit Card Payment Lifecycle Notifications API
  version: 1.0.0
  description: >
    API specification for notification generation, delivery, masking, authorization, and lifecycle management of credit card payment events.
    Ensures PII masking, role-based access, audit, state transition, resilience, and compliance throughout all API calls.

servers:
  - url: https://api.cardissuer.test
    description: Card Issuer Test Environment

security:
  - OAuth2:
      - notifications:read
      - notifications:write
      - users:read
      - logs:read

components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        password:
          tokenUrl: https://api.cardissuer.test/oauth/token
          scopes:
            notifications:read: Read notifications
            notifications:write: Create/send notifications
            users:read: Read user/account data
            logs:read: Read audit logs

  schemas:
    NotificationRequest:
      type: object
      required:
        - cardholder_email
        - card_last4
        - event_type
        - notification_channel
      properties:
        cardholder_email:
          type: string
          format: email
        card_last4:
          type: string
          pattern: '^\d{4}$'
          description: Only the last four digits of the card.
        event_type:
          type: string
          enum: [due reminder, overdue alert, collection notice, legal action notice, payment plan proposal, agency escalation]
        notification_channel:
          type: string
          enum: [email, portal, letter]
        account_status:
          type: string
          enum: [payment_due, overdue, delinquent, legal_escalation, plan_proposed, legal]
        balance:
          type: number
          format: float
          description: Account balance
        rate:
          type: string
          description: Reduced rate/fee for payment plan proposals

    NotificationResponse:
      type: object
      properties:
        notification_id:
          type: string
        delivered:
          type: boolean
        channel:
          type: string
          enum: [email, portal, letter]
        card_last4:
          type: string
          pattern: '^\d{4}$'
        content:
          type: string
          description: Notification/document content (with only last 4 digits)
        timestamp:
          type: string
          format: date-time
        event_type:
          type: string

    AuditLogEntry:
      type: object
      properties:
        log_id:
          type: string
        cardholder_email:
          type: string
          format: email
        card_last4:
          type: string
        event_type:
          type: string
        access_granted:
          type: boolean
        access_denied_reason:
          type: string
        timestamp:
          type: string
          format: date-time

    NotificationBulkRequest:
      type: object
      required:
        - cardholders
        - event_type
      properties:
        event_type:
          type: string
        notification_channel:
          type: string
        cardholders:
          type: array
          items:
            type: object
            properties:
              cardholder_email:
                type: string
                format: email
              card_last4:
                type: string
                pattern: '^\d{4}$'

    NotificationBulkResponse:
      type: object
      properties:
        total_sent:
          type: integer
        total_failed:
          type: integer
        latency_per_notification:
          type: number
          format: float
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'

    EscalationRequest:
      type: object
      required:
        - cardholder_email
        - card_last4
        - escalation_type
        - recipient
      properties:
        cardholder_email:
          type: string
          format: email
        card_last4:
          type: string
          pattern: '^\d{4}$'
        escalation_type:
          type: string
          enum: [collection agency, legal action]
        recipient:
          type: string

    PaymentPlanProposalRequest:
      type: object
      required:
        - cardholder_email
        - card_last4
        - rate
      properties:
        cardholder_email:
          type: string
          format: email
        card_last4:
          type: string
        rate:
          type: string

    PaymentPlanProposalResponse:
      type: object
      properties:
        proposal_id:
          type: string
        cardholder_email:
          type: string
          format: email
        card_last4:
          type: string
        reduced_rate:
          type: string
        sent:
          type: boolean
        content:
          type: string

    LegalDocumentRequest:
      type: object
      required:
        - account_email
        - card_last4
      properties:
        account_email:
          type: string
          format: email
        card_last4:
          type: string

    LegalDocumentResponse:
      type: object
      properties:
        document_id:
          type: string
        account_email:
          type: string
        card_last4:
          type: string
        content:
          type: string
        sent:
          type: boolean

paths:
  /notifications:
    post:
      summary: Trigger notification for payment lifecycle event
      tags:
        - Notifications
      requestBody:
        description: Notification generation request for a payment event
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '201':
          description: Notification delivered successfully (masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400':
          description: Bad request / Validation error
        '403':
          description: Unauthorized access to notification (masked, audit logged)
        '422':
          description: Notification cannot be sent due to invalid masking policy
      security:
        - OAuth2: [notifications:write]

  /notifications/bulk:
    post:
      summary: Trigger bulk notifications for high-volume scenarios
      tags:
        - Notifications
      requestBody:
        description: Bulk notification generation for mass campaigns (PII masked)
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationBulkRequest'
      responses:
        '201':
          description: Bulk notifications sent successfully (masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationBulkResponse'
        '400':
          description: Bad request (validation/masking error)
        '403':
          description: Unauthorized bulk operation
      security:
        - OAuth2: [notifications:write]

  /notifications/{notification_id}:
    get:
      summary: Retrieve notification details (masked/secure)
      tags:
        - Notifications
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification fetched (only last 4 digits included)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '403':
          description: Unauthorized, access denied and audit logged
        '404':
          description: Notification not found
      security:
        - OAuth2: [notifications:read]

  /notifications/access:
    post:
      summary: Restrict or validate notification access (role-based)
      tags:
        - Security/Privacy
      requestBody:
        description: User attempts to access notification (validate authorization)
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notification_id
                - requester_email
              properties:
                notification_id:
                  type: string
                requester_email:
                  type: string
                  format: email
      responses:
        '200':
          description: Access granted (only last 4 digits shown)
        '403':
          description: Access denied, error returned, no card digits exposed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Notification not found
      security:
        - OAuth2: [notifications:read]

  /audit/logs:
    get:
      summary: Download audit logs containing only masked card details
      tags:
        - Audit
      parameters:
        - name: cardholder_email
          in: query
          required: false
          schema:
            type: string
            format: email
        - name: event_type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Audit logs (PII masked, only last 4 digits)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
        '403':
          description: Unauthorized access to logs
      security:
        - OAuth2: [logs:read]

  /escalation:
    post:
      summary: Trigger escalation for overdue account (state-transition, masked)
      tags:
        - Escalation
      requestBody:
        description: Escalation event request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationRequest'
      responses:
        '201':
          description: Escalation delivered (only last 4 digits, compliance checked)
        '400':
          description: Invalid escalation (predecessor not complete or masking error)
        '403':
          description: Unauthorized escalation attempt
      security:
        - OAuth2: [notifications:write]

  /payment-plan/proposal:
    post:
      summary: Create and send masked payment plan proposal
      tags:
        - Payment Plan
      requestBody:
        description: Payment plan proposal generation with reduced rate
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPlanProposalRequest'
      responses:
        '201':
          description: Proposal created and sent (masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPlanProposalResponse'
        '400':
          description: Invalid request (rate or masking)
        '403':
          description: Unauthorized access
      security:
        - OAuth2: [notifications:write]

  /legal/documentation:
    post:
      summary: Generate legal document with masked card data
      tags:
        - Legal
      requestBody:
        description: Legal documentation generation (for external correspondence)
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalDocumentRequest'
      responses:
        '201':
          description: Legal document created and sent (PII masked compliance)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentResponse'
        '400':
          description: Invalid request/masking violation
        '403':
          description: Unauthorized legal documentation access
      security:
        - OAuth2: [notifications:write]

  /agency/integration:
    post:
      summary: Prepare and transmit agency integration package (masked)
      tags:
        - Agency
      requestBody:
        description: Prepare package for agency integration (last 4 digits only)
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cardholder_email
                - card_last4
              properties:
                cardholder_email:
                  type: string
                  format: email
                card_last4:
                  type: string
      responses:
        '201':
          description: Integration package transmitted (masked, privacy enforced)
        '400':
          description: Invalid package/masking violation
        '403':
          description: Unauthorized agency access
      security:
        - OAuth2: [notifications:write]

  /notifications/search:
    get:
      summary: Search notifications for masking violations (security/audit - negative)
      tags:
        - Security/Privacy
      parameters:
        - name: cardholder_email
          in: query
          required: true
          schema:
            type: string
            format: email
        - name: card_full
          in: query
          required: true
          schema:
            type: string
            description: Full card number being checked for exposure
      responses:
        '200':
          description: Scan complete, masking verified (no full card found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  found_instances:
                    type: integer
                    description: Should always be zero for compliance.
                  card_last4_only:
                    type: boolean
        '403':
          description: Unauthorized search operation
      security:
        - OAuth2: [notifications:read]

  /resilience/simulate-crash:
    post:
      summary: Simulate backend crash and validate masking after recovery
      tags:
        - Resilience
      requestBody:
        description: Simulate crash scenario for masking enforcement
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cardholder_email
                - card_last4
              properties:
                cardholder_email:
                  type: string
                  format: email
                card_last4:
                  type: string
      responses:
        '200':
          description: Masking valid after crash/recovery (only last 4 digits)
          content:
            application/json:
              schema:
                type: object
                properties:
                  masking_valid:
                    type: boolean
                  exposed_digits:
                    type: integer
        '400':
          description: Crash simulation failed

  /state-transition/update:
    post:
      summary: Update account/payment state and enforce masking
      tags:
        - State-Transition
      requestBody:
        description: State transition with masking on alerts/notifications
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cardholder_email
                - account_status
                - next_status
                - card_last4
              properties:
                cardholder_email:
                  type: string
                  format: email
                account_status:
                  type: string
                next_status:
                  type: string
                card_last4:
                  type: string
      responses:
        '200':
          description: State updated, notification masked
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: boolean
                  notification:
                    $ref: '#/components/schemas/NotificationResponse'
        '400':
          description: State update failed (invalid transition/masking issue)

  /notifications/multi-cardholder:
    post:
      summary: Send notifications for cardholders with multiple cards (boundary masking)
      tags:
        - Boundary/Functional
      requestBody:
        description: Send/remind for specific card (multi-cardholder, no cross-leakage)
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cardholder_email
                - cards
                - events
              properties:
                cardholder_email:
                  type: string
                  format: email
                cards:
                  type: array
                  items:
                    type: object
                    properties:
                      card_last4:
                        type: string
                      event_type:
                        type: string
      responses:
        '201':
          description: Notifications sent, only relevant last 4 digits, no cross-leakage
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationResponse'

  /notifications/boundary/escalation:
    post:
      summary: Trigger escalation based on balance thresholds (boundary masking)
      tags:
        - Boundary/Functional
      requestBody:
        description: Escalation if overdue balance meets/exceeds threshold, masked
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cardholder_email
                - balance
                - threshold
                - card_last4
              properties:
                cardholder_email:
                  type: string
                  format: email
                balance:
                  type: number
                  format: float
                threshold:
                  type: number
                  format: float
                card_last4:
                  type: string
      responses:
        '201':
          description: Escalation/notification sent if threshold met. Masked only last 4 digits.
        '200':
          description: No escalation; threshold not met.
        '400':
          description: Invalid masking/balance error

  # Other endpoints as needed (e.g. /legal/audit-access, /agency/case, etc.) can be structured as above.

